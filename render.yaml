services:
  - type: web
    name: skillcert-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CLIENT_URL
        value: https://skillcert-ai-six.vercel.app
      - key: FRONTEND_URL
        value: https://skillcert-ai-six.vercel.app
      - key: API_BASE_URL
        value: https://skillcert-ai-1.onrender.com
